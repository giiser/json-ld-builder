<div class="p-4 border-l-4 rounded-r-md" [ngClass]="level === 0 ? 'border-emerald-500 bg-white' : 'border-gray-300 bg-gray-50 mt-2'">
    <h3 class="font-bold text-lg text-gray-800 mb-4 flex items-center gap-2">
        {{ typeId }}
        <span *ngIf="level > 0" class="text-xs font-normal text-gray-500 bg-gray-200 px-2 py-1 rounded">Nested</span>
    </h3>

    <div class="flex flex-col gap-4">
        <ng-container *ngFor="let propId of properties">
            <div *ngIf="getPropInfo(propId) as propInfo" class="flex flex-col">
                <label class="text-sm font-semibold text-gray-700 mb-1">{{ propInfo.label }}</label>

                <div *ngIf="isSimple(propInfo); else complexField">
                    <input
                        type="text"
                        [placeholder]="'Enter ' + propInfo.label + '...'"
                        class="border border-gray-300 p-2 rounded focus:ring-2 focus:ring-emerald-500 focus:outline-none w-full"
                        [ngModel]="value[propId] || ''"
                        (ngModelChange)="onFieldChange(propId, $event)"
                    />
                </div>

                <ng-template #complexField>
                    <div class="pl-4 border-l-2 border-dashed border-gray-300">
                        <div *ngIf="value[propId]; else emptyComplex" class="relative">
                            <button
                                (click)="onRemoveNested(propId)"
                                class="absolute top-2 right-2 text-red-500 text-xs hover:underline z-10"
                            >
                                Remove
                            </button>
                            <app-schema-node
                                [typeId]="value[propId]['@type']"
                                [value]="value[propId]"
                                [level]="level + 1"
                                (valueChange)="onNestedChange(propId, $event, value[propId])"
                            ></app-schema-node>
                        </div>
                        <ng-template #emptyComplex>
                            <div class="mt-2">
                                <ng-select
                                    [items]="dropdownOptionsCache[propId]"
                                    bindLabel="label"
                                    bindValue=""
                                    placeholder="Select nested type..."
                                    [searchable]="true"
                                    (change)="onDropdownChange(propId, $event)"
                                    class="text-sm text-gray-900 custom-ng-select"
                                    appendTo="body"
                                ></ng-select>
                            </div>
                        </ng-template>
                    </div>
                </ng-template>
            </div>
        </ng-container>
    </div>
</div>
